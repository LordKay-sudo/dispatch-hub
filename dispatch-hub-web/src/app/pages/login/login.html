<div class="login-wrap">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Dispatch Hub</mat-card-title>
      <mat-card-subtitle>Operations console sign-in</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field appearance="outline" class="full">
        <mat-label>Username</mat-label>
        <input matInput [(ngModel)]="username" name="username" autocomplete="username" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
        />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full">
        <mat-label>Tenant code</mat-label>
        <input matInput [(ngModel)]="tenantCode" name="tenantCode" />
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-flat-button color="primary" type="button" (click)="submit()" [disabled]="loading()">
        @if (loading()) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else {
          Login
        }
      </button>
    </mat-card-actions>
  </mat-card>
</div>
