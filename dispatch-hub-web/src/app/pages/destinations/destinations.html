<div class="page">
  <h1>Destinations</h1>
  <p>Webhook endpoints for the current tenant.</p>

  @if (auth.isAdmin) {
    <mat-card class="create-card">
      <mat-card-header>
        <mat-card-title>Create destination</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input matInput [(ngModel)]="name" name="name" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Target URL</mat-label>
            <input matInput [(ngModel)]="targetUrl" name="targetUrl" />
          </mat-form-field>
        </div>
      </mat-card-content>
      <mat-card-actions align="end">
        <button mat-flat-button color="primary" type="button" (click)="create()" [disabled]="saving()">
          Create
        </button>
      </mat-card-actions>
    </mat-card>
  }

  @if (loading()) {
    <div class="center"><mat-spinner diameter="36"></mat-spinner></div>
  } @else {
    <table mat-table [dataSource]="rows()" class="mat-elevation-z1 full-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>
      <ng-container matColumnDef="targetUrl">
        <th mat-header-cell *matHeaderCellDef>Target URL</th>
        <td mat-cell *matCellDef="let row" class="mono">{{ row.targetUrl }}</td>
      </ng-container>
      <ng-container matColumnDef="enabled">
        <th mat-header-cell *matHeaderCellDef>Enabled</th>
        <td mat-cell *matCellDef="let row">{{ row.enabled ? 'Yes' : 'No' }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  }
</div>
