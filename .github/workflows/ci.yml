name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispatch-hub-api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: dispatch_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispatch -d dispatch_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: dispatch_hub

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run API tests
        run: ./mvnw -B verify

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispatch-hub-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dispatch-hub-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
