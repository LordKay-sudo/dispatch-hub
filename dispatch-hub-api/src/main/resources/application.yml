spring:
  application:
    name: dispatch-hub-api
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:dispatch_hub}
    username: ${POSTGRES_USER:dispatch}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-chars}
      ttl: 8h

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
