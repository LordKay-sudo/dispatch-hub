spring.application.name=dispatch-hub-api

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:dispatch_hub}
spring.datasource.username=${POSTGRES_USER:dispatch}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.security.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-chars}
app.security.jwt.ttl=8h

app.dispatch.worker-id=${DISPATCH_WORKER_ID:dispatch-hub-1}
app.dispatch.batch-size=10
app.dispatch.poll-interval-ms=2000
app.dispatch.max-attempts=5
app.dispatch.backoff-base-seconds=2
app.dispatch.backoff-max-seconds=300
app.dispatch.rate-limit-per-minute=60

app.security.ssrf.allow-loopback=${SSRF_ALLOW_LOOPBACK:true}
# false by default; Compose sets true so webhook-echo (RFC1918) can be used in demos
app.security.ssrf.allow-private=${SSRF_ALLOW_PRIVATE:false}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080,http://127.0.0.1:8080,http://127.0.0.1:4200}

app.ai.provider=${AI_PROVIDER:mock}

# mock (default/CI) disables OpenAI chat autoconfig; openai enables it
spring.ai.model.chat=${AI_PROVIDER:mock}
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
# Belt-and-braces: never wire unused OpenAI audio beans (breaks boot when chat=openai without speech creds)
spring.autoconfigure.exclude=\
org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration

spring.ai.openai.api-key=${OPENAI_API_KEY:disabled-for-local}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-4o-mini}
# JSON mode keeps chat replies parseable for the failure summarizer
spring.ai.openai.chat.response-format.type=JSON_OBJECT

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

server.port=8080

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
