services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-dispatch_hub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dispatch} -d ${POSTGRES_DB:-dispatch_hub}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # In-compose webhook target for full-stack demos (Docker DNS → private IP).
  webhook-echo:
    image: hashicorp/http-echo:1.0
    command: ["-text={\"ok\":true}", "-listen=:5678"]
    expose:
      - "5678"

  api:
    build:
      context: ./dispatch-hub-api
    ports:
      - "8081:8080"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dispatch_hub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dispatch}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-at-least-32-chars}
      SSRF_ALLOW_LOOPBACK: ${SSRF_ALLOW_LOOPBACK:-true}
      # Compose DNS (webhook-echo) resolves to RFC1918; demo only — keep false outside Docker.
      SSRF_ALLOW_PRIVATE: ${SSRF_ALLOW_PRIVATE:-true}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8080,http://127.0.0.1:8080,http://127.0.0.1:4200,http://localhost}
      DISPATCH_WORKER_ID: ${DISPATCH_WORKER_ID:-compose-api-1}
    depends_on:
      postgres:
        condition: service_healthy
      webhook-echo:
        condition: service_started

  web:
    build:
      context: ./dispatch-hub-web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
